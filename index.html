<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Number Scanner</title>

  <!-- Tesseract.js - OCR engine -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #090E1A;
      --card: #16213E;
      --border: #1A2440;
      --accent: #00E5FF;
      --text: #FFFFFF;
      --sub: #888888;
      --success: #4CAF50;
      --error: #FF6B6B;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #0D1220;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    #header .sub {
      font-size: 12px;
      color: var(--accent);
      margin-top: 2px;
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .toggle-wrap span {
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.3s;
    }

    .slider:before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #888;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .slider {
      background: #00E5FF30;
      border: 1px solid var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background: var(--accent);
    }

    /* ── Main Content ── */
    #main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ── Camera Section ── */
    #camera-section {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 58vh;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
    }

    /* Scan Overlay */
    #scan-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 58vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      pointer-events: none;
    }

    #overlay-top {
      background: rgba(0,0,0,0.6);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    #scan-frame {
      width: 82vw;
      height: 140px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Frame corners */
    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--accent);
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top:0; left:0; border-top-width:3px; border-left-width:3px; }
    .corner.tr { top:0; right:0; border-top-width:3px; border-right-width:3px; }
    .corner.bl { bottom:0; left:0; border-bottom-width:3px; border-left-width:3px; }
    .corner.br { bottom:0; right:0; border-bottom-width:3px; border-right-width:3px; }

    /* Scan line */
    #scan-line {
      position: absolute;
      width: 90%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scanMove 2s ease-in-out infinite alternate;
      box-shadow: 0 0 8px var(--accent);
    }

    @keyframes scanMove {
      from { top: 10px; }
      to { top: 125px; }
    }

    #overlay-bottom {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    /* Blur / Focus indicator */
    #focus-indicator {
      position: absolute;
      top: 10px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.65);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #focus-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transition: background 0.3s;
    }
    #focus-indicator.blurry #focus-dot { background: var(--error); }
    #focus-indicator.blurry { color: var(--error); }
    #focus-indicator.sharp  { color: var(--success); }
    #focus-indicator.sharp  #focus-dot { background: var(--success); }

    /* Tap-to-focus ripple */
    .focus-ripple {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 1;
      animation: rippleFade 0.7s ease-out forwards;
      z-index: 10;
    }
    @keyframes rippleFade {
      to { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
    }

    /* Manual capture button */
    #capture-btn-wrap {
      position: absolute;
      bottom: 16px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #capture-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 3px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #capture-btn:active {
      transform: scale(0.93);
    }

    #capture-btn-inner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fff;
    }

    #capture-hint {
      color: rgba(255,255,255,0.6);
      font-size: 12px;
    }

    /* Auto processing */
    #auto-processing {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 16px 28px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border: 1px solid #00E5FF20;
      display: none;
    }

    #auto-processing .spin {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #auto-processing p {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    /* ── Preview Section ── */
    #preview-section {
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #preview-img {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
    }

    #processing-overlay {
      position: absolute;
      background: rgba(0,0,0,0.85);
      padding: 28px 40px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      border: 1px solid #00E5FF20;
    }

    #processing-overlay .spin {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #processing-overlay p {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    /* Error on preview */
    #error-overlay {
      position: absolute;
      background: rgba(0,0,0,0.9);
      padding: 28px 36px;
      border-radius: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border: 1px solid #FF3D3D30;
      text-align: center;
    }

    #error-overlay .err-icon { font-size: 40px; }

    #error-overlay p {
      color: var(--error);
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 70vw;
      text-align: center;
    }

    #retry-btn {
      margin-top: 6px;
      background: var(--card);
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Result Section ── */
    #result-section {
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: none;
      flex-direction: column;
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #result-thumb {
      width: 100%;
      height: 110px;
      object-fit: cover;
      opacity: 0.5;
      flex-shrink: 0;
    }

    #result-count {
      text-align: center;
      color: var(--accent);
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #number-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    /* Number Card */
    .num-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin: 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .num-left { flex: 1; }

    .auto-badge {
      background: #00E5FF15;
      border: 1px solid #00E5FF30;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .num-display {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-family: monospace;
      color: #fff;
    }

    .num-raw {
      font-size: 12px;
      color: var(--sub);
      margin-top: 3px;
    }

    .copy-btn {
      background: #0F3460;
      border: 1px solid #1A5276;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 66px;
    }

    .copy-btn:active { transform: scale(0.94); }

    .copy-btn.copied {
      background: #1B5E2080;
      border-color: var(--success);
    }

    .copy-btn .icon { font-size: 20px; }
    .copy-btn .label {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
    }
    .copy-btn.copied .label { color: var(--success); }

    #rescan-btn {
      margin: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    #rescan-btn:active { opacity: 0.7; }

    /* ── Bottom Bar ── */
    #bottom-bar {
      background: #0D1220;
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      text-align: center;
      font-size: 12px;
      color: #555;
      flex-shrink: 0;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: #1A2440;
      color: #fff;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--accent);
      opacity: 0;
      transition: all 0.3s;
      white-space: nowrap;
      z-index: 999;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Hidden */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<div id="header">
  <div>
    <h1>📱 Number Scanner</h1>
    <div class="sub" id="mode-label">⚡ অটো মোড</div>
  </div>
  <div class="toggle-wrap">
    <span>অটো</span>
    <label class="switch">
      <input type="checkbox" id="auto-toggle" checked />
      <span class="slider"></span>

  </div>
</div>

<!-- ── Main ── -->
<div id="main">

  <!-- Camera -->
  <div id="camera-section">
    <video id="video" autoplay playsinline muted></video>

    <div id="scan-overlay">
      <div id="overlay-top">⚡ অটো ক্যাপচার হবে...</div>
      <div id="scan-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div id="scan-line"></div>
      </div>
      <div id="overlay-bottom">নম্বরের কাছে ধরুন (10-20cm)</div>
    </div>

    <!-- Focus indicator (top-right) -->
    <div id="focus-indicator">
      <div id="focus-dot"></div>
      <span id="focus-label">Focus</span>
    </div>

    <!-- Manual button -->
    <div id="capture-btn-wrap" class="hidden">
      <div id="capture-btn">
        <div id="capture-btn-inner"></div>
      </div>
      <div id="capture-hint">ট্যাপ করে স্ক্যান করুন</div>
    </div>

    <!-- Auto processing indicator -->
    <div id="auto-processing">
      <div class="spin"></div>
      <p>🔍 স্ক্যান হচ্ছে...</p>
    </div>
  </div>

  <!-- Preview -->
  <div id="preview-section">
    <img id="preview-img" src="" alt="preview" />
    <div id="processing-overlay">
      <div class="spin"></div>
      <p id="proc-status">🔍 নম্বর খোঁজা হচ্ছে...</p>
    </div>
    <div id="error-overlay">
      <div class="err-icon">😕</div>
      <p id="error-msg">কোনো নম্বর পাওয়া যায়নি</p>
      <button id="retry-btn">🔄 আবার চেষ্টা করুন</button>
    </div>
  </div>

  <!-- Result -->
  <div id="result-section">

    <div id="result-count">✅ নম্বর পাওয়া গেছে</div>
    <div id="number-list"></div>
    <div id="rescan-btn">🔄 আবার স্ক্যান করুন</div>
  </div>

</div>

<!-- ── Bottom ── -->
<div id="bottom-bar" id="bottom-tip">
  📌 ফোন স্থির রাখুন, অটো স্ক্যান হবে
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Hidden canvas for capture -->
<canvas id="canvas" class="hidden"></canvas>

<script>
// ════════════════════════════════════════
//  ⚙️ CONFIG — এখানে শুধু বদলাও
// ════════════════════════════════════════
const AI_CONFIG = {
  endpoint : 'https://api.groq.com/openai/v1/chat/completions',
  apiKey   : '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',
  model    : 'qwen/qwen3.6-27b',
};
// অন্য router এ বদলানোর উদাহরণ:
// endpoint : 'https://api.tabitoken.com/v1/chat/completions'
// endpoint : 'https://api.gorouter.ai/v1/chat/completions'
// ════════════════════════════════════════
// ════════════════════════════════════════
//  NUMBER FORMATTER
// ════════════════════════════════════════
function extractNumbers(text) {
  if (!text) return [];

  const found = new Set();

  // OCR ভুল ঠিক করো (O→0, l→1)
  let t = text
    .replace(/[oO]/g, '0')
    .replace(/[lI|]/g, '1')
    .replace(/\s+/g, ' ');

  // Pattern 1: +8801XXXXXXXXX
  [...t.matchAll(/\+880(1[3-9]\d{8})/g)]
    .forEach(m => found.add('0' + m[1]));

  // Pattern 2: 8801XXXXXXXXX
  [...t.matchAll(/(?<!\d)880(1[3-9]\d{8})(?!\d)/g)]
    .forEach(m => found.add('0' + m[1]));

  // Pattern 3: 01XXXXXXXXX
  [...t.matchAll(/(?<!\d)(01[3-9]\d{8})(?!\d)/g)]
    .forEach(m => found.add(m[1]));

  // Pattern 4: 01XXX-XXXXXX বা 01XXX XXXXXX
  [...t.matchAll(/(01[3-9]\d{3})[-\s](\d{6})(?!\d)/g)]
    .forEach(m => {
      const n = m[1] + m[2];
      if (n.length === 11) found.add(n);
    });

  // Pattern 5: 1XXXXXXXXX (0 ছাড়া)
  [...t.matchAll(/(?<!\d)(1[3-9]\d{8})(?!\d)/g)]
    .forEach(m => found.add('0' + m[1]));

  return [...found].filter(n => /^01[3-9]\d{8}$/.test(n));
}

function formatDisplay(num) {
  return num;
}

// ════════════════════════════════════════
//  STORAGE
// ════════════════════════════════════════
function loadAutoMode() {
  const v = localStorage.getItem('autoMode');
  return v === null ? true : v === 'true';
}

function saveAutoMode(v) {
  localStorage.setItem('autoMode', String(v));
}

// ════════════════════════════════════════
//  APP STATE
// ════════════════════════════════════════
let autoMode = loadAutoMode();
let stream = null;
let autoTimer = null;
let isProcessing = false;
let currentPhase = 'camera'; // camera | preview | result
let capturedDataUrl = null;

// ════════════════════════════════════════
//  DOM Elements
// ════════════════════════════════════════
const video          = document.getElementById('video');
const canvas         = document.getElementById('canvas');
const autoToggle     = document.getElementById('auto-toggle');
const modeLabel      = document.getElementById('mode-label');
const overlayTop     = document.getElementById('overlay-top');
const captureBtnWrap = document.getElementById('capture-btn-wrap');
const captureBtn     = document.getElementById('capture-btn');
const autoProc       = document.getElementById('auto-processing');
const cameraSection  = document.getElementById('camera-section');
const previewSection = document.getElementById('preview-section');
const previewImg     = document.getElementById('preview-img');
const procOverlay    = document.getElementById('processing-overlay');
const errorOverlay   = document.getElementById('error-overlay');
const errorMsg       = document.getElementById('error-msg');
const retryBtn       = document.getElementById('retry-btn');
const resultSection  = document.getElementById('result-section');
const resultThumb    = document.getElementById('result-thumb');
const resultCount    = document.getElementById('result-count');
const numberList     = document.getElementById('number-list');
const rescanBtn      = document.getElementById('rescan-btn');
const bottomBar      = document.getElementById('bottom-bar');
const toastEl        = document.getElementById('toast');

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════
async function init() {
  // Auto mode load
  autoToggle.checked = autoMode;
  updateModeUI();

  // Camera শুরু করো
  await startCamera();
}

// ════════════════════════════════════════
//  CAMERA
// ════════════════════════════════════════
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // পেছনের ক্যামেরা
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        focusMode: 'continuous',   // Auto focus
        zoom: 1,
      },
      audio: false,
    });

    video.srcObject = stream;

    video.onloadedmetadata = () => {
      // Auto mode এ 2 সেকেন্ড পর capture
      if (autoMode) {
        scheduleAutoCapture();
      }
    };

  } catch (err) {
    console.error('Camera error:', err);
    showToast('❌ ক্যামেরা চালু হয়নি - Permission দিন');
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  clearTimeout(autoTimer);
}

// ════════════════════════════════════════
//  BLUR DETECTION (Laplacian variance on canvas)
// ════════════════════════════════════════
const blurCanvas = document.createElement('canvas');
const blurCtx    = blurCanvas.getContext('2d', { willReadFrequently: true });

function measureBlur() {
  // scan-frame এর ভেতরের অংশ থেকে blur মাপো
  const vw = video.videoWidth  || 640;
  const vh = video.videoHeight || 480;
  const scanFrame = document.getElementById('scan-frame');
  const videoEl   = document.getElementById('video');
  const sfRect    = scanFrame.getBoundingClientRect();
  const vidRect   = videoEl.getBoundingClientRect();

  if (vidRect.width === 0 || vidRect.height === 0) return 999; // camera not ready

  // object-fit: cover offset
  const vidAspect  = vw / vh;
  const elemAspect = vidRect.width / vidRect.height;
  let renderW, renderH, offsetX, offsetY;
  if (vidAspect > elemAspect) {
    renderH = vidRect.height; renderW = vidRect.height * vidAspect;
    offsetX = (vidRect.width - renderW) / 2; offsetY = 0;
  } else {
    renderW = vidRect.width; renderH = vidRect.width / vidAspect;
    offsetX = 0; offsetY = (vidRect.height - renderH) / 2;
  }
  const scaleX = vw / renderW;
  const scaleY = vh / renderH;
  const sx = Math.max(0, Math.round((sfRect.left - vidRect.left - offsetX) * scaleX));
  const sy = Math.max(0, Math.round((sfRect.top  - vidRect.top  - offsetY) * scaleY));
  const sw = Math.min(Math.round(sfRect.width  * scaleX), vw - sx);
  const sh = Math.min(Math.round(sfRect.height * scaleY), vh - sy);

  // ছোট size এ downsample করো (fast)
  const W = 80, H = 30;
  blurCanvas.width  = W;
  blurCanvas.height = H;
  blurCtx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);

  const data = blurCtx.getImageData(0, 0, W, H).data;

  // Grayscale Laplacian variance
  const gray = [];
  for (let i = 0; i < W * H; i++) {
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    gray.push(0.299*r + 0.587*g + 0.114*b);
  }

  // Laplacian kernel: center=4, sides=-1
  let sum = 0, count = 0;
  for (let y = 1; y < H-1; y++) {
    for (let x = 1; x < W-1; x++) {
      const lap =
        4*gray[y*W+x]
        - gray[(y-1)*W+x]
        - gray[(y+1)*W+x]
        - gray[y*W+(x-1)]
        - gray[y*W+(x+1)];
      sum += lap * lap;
      count++;
    }
  }
  return count > 0 ? sum / count : 0;
}

// Blur threshold — এর নিচে হলে blurry ধরা হবে
const BLUR_THRESHOLD = 80;
let blurCheckInterval = null;
let sharpFrameCount   = 0;   // পরপর কতটা sharp frame আসলে capture করবে
const SHARP_FRAMES_NEEDED = 3;

function startBlurMonitor() {
  stopBlurMonitor();
  sharpFrameCount = 0;
  const focusIndicator = document.getElementById('focus-indicator');
  const focusLabel     = document.getElementById('focus-label');

  blurCheckInterval = setInterval(() => {
    if (currentPhase !== 'camera' || isProcessing) return;

    const score = measureBlur();
    const isSharp = score >= BLUR_THRESHOLD;

    // UI আপডেট
    focusIndicator.className = isSharp ? 'sharp' : 'blurry';
    focusLabel.textContent   = isSharp ? 'Sharp' : 'Blur';

    if (autoMode) {
      if (isSharp) {
        sharpFrameCount++;
        if (sharpFrameCount >= SHARP_FRAMES_NEEDED) {
          // যথেষ্ট sharp — capture!
          stopBlurMonitor();
          capture();
        }
      } else {
        sharpFrameCount = 0; // blur এলে reset
      }
    }
  }, 300); // প্রতি 300ms চেক
}

function stopBlurMonitor() {
  if (blurCheckInterval) {
    clearInterval(blurCheckInterval);
    blurCheckInterval = null;
  }
}

// ════════════════════════════════════════
//  TAP-TO-FOCUS
// ════════════════════════════════════════
async function tapToFocus(e) {
  if (currentPhase !== 'camera') return;

  const vidRect = video.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - vidRect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - vidRect.top;

  // Ripple effect
  const ripple = document.createElement('div');
  ripple.className = 'focus-ripple';
  ripple.style.left = (x + vidRect.left) + 'px';
  ripple.style.top  = (y + vidRect.top)  + 'px';
  ripple.style.position = 'fixed';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 700);

  // Browser focusPoint API (Android Chrome support)
  try {
    const track = stream?.getVideoTracks()?.[0];
    if (track) {
      const caps = track.getCapabilities?.();
      if (caps?.focusMode?.includes?.('manual') || caps?.pointsOfInterest) {
        const xRatio = Math.max(0, Math.min(1, x / vidRect.width));
        const yRatio = Math.max(0, Math.min(1, y / vidRect.height));
        await track.applyConstraints({
          advanced: [{ focusMode: 'manual', pointsOfInterest: [{ x: xRatio, y: yRatio }] }]
        });
        // একটু পরে continuous এ ফিরিয়ে দাও
        setTimeout(() => {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }, 2000);
      }
    }
  } catch (err) {
    // Focus API সাপোর্ট না করলে ignore
  }

  // Blur monitor reset — নতুন করে sharp frame খোঁজো
  sharpFrameCount = 0;
  showToast('🎯 ফোকাস করা হচ্ছে...');
}

function scheduleAutoCapture() {
  clearTimeout(autoTimer);
  // blur monitor দিয়ে auto capture করবে
  autoTimer = setTimeout(() => {
    if (currentPhase === 'camera' && autoMode && !isProcessing) {
      startBlurMonitor();
    }
  }, 800); // camera settle হতে একটু সময় দাও
}

// ════════════════════════════════════════
//  CAPTURE
// ════════════════════════════════════════
async function capture() {
  if (isProcessing || currentPhase !== 'camera') return;
  isProcessing = true;

  const vw = video.videoWidth  || 1280;
  const vh = video.videoHeight || 720;

  // ── Full frame (preview thumb এর জন্য) ──
  canvas.width  = vw;
  canvas.height = vh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, vw, vh);
  capturedDataUrl = canvas.toDataURL('image/jpeg', 0.95);

  // ── Scan frame এর rectangle crop করো ──
  const scanFrame = document.getElementById('scan-frame');
  const videoEl   = document.getElementById('video');
  const sfRect    = scanFrame.getBoundingClientRect();
  const vidRect   = videoEl.getBoundingClientRect();

  // object-fit: cover — video content আসলে element এর চেয়ে বড় হতে পারে
  // intrinsic video ratio vs displayed element ratio
  const vidAspect  = vw / vh;
  const elemAspect = vidRect.width / vidRect.height;

  let renderW, renderH, offsetX, offsetY;
  if (vidAspect > elemAspect) {
    // video র দুই পাশ কাটা (letterbox horizontal)
    renderH  = vidRect.height;
    renderW  = vidRect.height * vidAspect;
    offsetX  = (vidRect.width - renderW) / 2;  // negative — video বাইরে যায়
    offsetY  = 0;
  } else {
    // video র উপর-নিচ কাটা (letterbox vertical)
    renderW  = vidRect.width;
    renderH  = vidRect.width / vidAspect;
    offsetX  = 0;
    offsetY  = (vidRect.height - renderH) / 2; // negative
  }

  // scan frame → rendered video এর relative position
  const relX = sfRect.left - vidRect.left - offsetX;
  const relY = sfRect.top  - vidRect.top  - offsetY;

  // rendered video pixel → actual video pixel ratio
  const scaleX = vw / renderW;
  const scaleY = vh / renderH;

  const sx = Math.max(0, Math.round(relX * scaleX));
  const sy = Math.max(0, Math.round(relY * scaleY));
  const sw = Math.min(Math.round(sfRect.width  * scaleX), vw - sx);
  const sh = Math.min(Math.round(sfRect.height * scaleY), vh - sy);

  // Crop canvas — exact rectangle, no extra padding
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width  = sw;
  cropCanvas.height = sh;
  const cCtx = cropCanvas.getContext('2d');
  cCtx.drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);

  const cropDataUrl = cropCanvas.toDataURL('image/jpeg', 0.95);

  // Preview দেখাও (full image)
  showPhase('preview');
  previewImg.src = capturedDataUrl;
  procOverlay.style.display = 'flex';
  errorOverlay.style.display = 'none';

  // OCR শুধু crop করা অংশে চালাও
  await runOCR(cropDataUrl);
}

// ════════════════════════════════════════
//  OCR - Tesseract → AI fallback
// ════════════════════════════════════════
const procStatus = document.getElementById('proc-status');

async function runOCR(dataUrl) {
  // ── Step 1: Tesseract ──
  try {
    procStatus.textContent = '🔍 Tesseract দিয়ে খোঁজা হচ্ছে...';
    const result = await Tesseract.recognize(dataUrl, 'eng', {
      tessedit_char_whitelist: '0123456789+- ',
    });
    const rawText = result.data.text;
    console.log('Tesseract:', rawText);
    const numbers = extractNumbers(rawText);

    if (numbers.length > 0) {
      await finishWithNumbers(numbers, 'Tesseract');
      return;
    }
    console.log('Tesseract miss → Groq fallback');
  } catch (err) {
    console.warn('Tesseract error:', err);
  }

  // ── Step 2: Groq Vision fallback ──
  procStatus.textContent = '🤖 AI দিয়ে চেষ্টা হচ্ছে...';
  let groqError = null;
  let numbers   = [];

  try {
    numbers = await runGroqVision(dataUrl);
    console.log('Groq:', numbers);
  } catch (err) {
    console.warn('Groq error:', err);
    groqError = err;
  }

  procOverlay.style.display = 'none';

  if (groqError) {
    const raw = groqError.message || 'AI সার্ভারে সমস্যা হয়েছে';
    errorOverlay.style.display = 'flex';
    errorMsg.textContent = '⚠️ ' + raw;
    isProcessing = false;
    return;
  }

  if (numbers.length > 0) {
    await finishWithNumbers(numbers, 'Groq');
    return;
  }

  // দুটোতেই number পাওয়া যায়নি
  errorOverlay.style.display = 'flex';
  errorMsg.textContent = 'কোনো নম্বর পাওয়া যায়নি 😕';
  isProcessing = false;
}

async function runGroqVision(dataUrl) {
  const base64 = dataUrl.split(',')[1];
  const mime   = dataUrl.split(';')[0].split(':')[1];

  const res = await fetch(AI_CONFIG.endpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${AI_CONFIG.apiKey}`,
    },
    body: JSON.stringify({
      model: AI_CONFIG.model,
      max_tokens: 300,
      messages: [{
        role: 'user',
        content: [
          {
            type: 'image_url',
            image_url: { url: `data:${mime};base64,${base64}` }
          },
          {
            type: 'text',
            text: `Extract ALL phone numbers from this image — printed, screen display, or handwritten.\nReturn ONLY a JSON array of digit strings. No explanation. No markdown. No extra text.\nExample: ["01712345678","01987654321"]\nRules:\n- Include Bangladeshi numbers (11 digits starting with 013-019)\n- Include any other phone numbers\n- Digits only — remove spaces, dashes, brackets\n- For handwritten: watch 1 vs 7, 0 vs 6 vs 8, 3 vs 8\n- If none found, return []`
          }
        ]
      }]
    }),
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData.error?.message || `Groq ${res.status}`);
  }

  const data = await res.json();
  let raw = data.choices?.[0]?.message?.content?.trim() || '[]';
  console.log('Groq raw:', raw);

  // think tag, markdown fence সরাও
  raw = raw.replace(/<think>[\s\S]*?<\/think>/gi, '');
  raw = raw.replace(/<think>[\s\S]*/gi, '');
  raw = raw.replace(/```[a-z]*|```/gi, '').trim();

  // JSON array খোঁজো
  const match = raw.match(/\[[\s\S]*?\]/);
  const jsonStr = match ? match[0] : '[]';

  let arr;
  try { arr = JSON.parse(jsonStr); } catch { arr = []; }
  if (!Array.isArray(arr)) arr = [];

  // +8801 / 8801 → 01xxx normalize, তারপর validate
  const normalized = arr.map(n => {
    const m = String(n).replace(/[\s\-()]/g, '').match(/(01[3-9]\d{8})$/);
    return m ? m[1] : String(n).replace(/\D/g, '');
  }).filter(n => /^01[3-9]\d{8}$/.test(n));

  return normalized;
}

async function finishWithNumbers(numbers, source) {
  if (autoMode && numbers[0]) {
    await copyToClipboard(numbers[0]);
    showToast(`✅ ${numbers[0]} কপি হয়েছে`);
  }
  showResult(numbers, source);
}

// ════════════════════════════════════════
//  SHOW RESULT
// ════════════════════════════════════════
function showResult(numbers, source) {
  procOverlay.style.display = 'none';
  showPhase('result');

  resultThumb.src = capturedDataUrl;
  const srcBadge = source === 'Groq'
    ? ' <span style="font-size:11px;color:#aaa;font-weight:400">via 🤖 AI</span>'
    : '';
  resultCount.innerHTML = `✅ ${numbers.length}টি নম্বর পাওয়া গেছে${srcBadge}`;
  numberList.innerHTML = '';

  numbers.forEach((num, idx) => {
    const isFirst = idx === 0;
    const card = document.createElement('div');
    card.className = 'num-card';

    card.innerHTML = `
      <div class="num-left">
        ${autoMode && isFirst
          ? '<span class="auto-badge">⚡ অটো কপি হয়েছে</span>'
          : ''}
        <div class="num-display">${formatDisplay(num)}</div>
        <div class="num-raw">${num}</div>
      </div>
      <button class="copy-btn" data-num="${num}">
        <span class="icon">📋</span>
        <span class="label">কপি</span>
      </button>
    `;

    numberList.appendChild(card);
  });

  // Copy button events
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const num = btn.dataset.num;
      await copyToClipboard(num);
      btn.classList.add('copied');
      btn.querySelector('.icon').textContent = '✅';
      btn.querySelector('.label').textContent = 'কপি';
      showToast(`✅ ${num} কপি হয়েছে`);
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.querySelector('.icon').textContent = '📋';
      }, 3000);
    });
  });

  bottomBar.textContent = autoMode
    ? '📌 প্রথম নম্বর অটো কপি হয়েছে'
    : '📌 নম্বর কপি করতে বাটন চাপুন';

  isProcessing = false;
}

// ════════════════════════════════════════
//  RESCAN
// ════════════════════════════════════════
function rescan() {
  capturedDataUrl = null;
  isProcessing = false;
  stopBlurMonitor();
  showPhase('camera');

  // Auto mode এ আবার schedule
  if (autoMode) {
    scheduleAutoCapture();
  }

  bottomBar.textContent = autoMode
    ? '📌 ফোন স্থির রাখুন, অটো স্ক্যান হবে'
    : '📌 নম্বরের কাছে ধরে বাটন চাপুন';
}

// ════════════════════════════════════════
//  PHASE MANAGER
// ════════════════════════════════════════
function showPhase(phase) {
  currentPhase = phase;
  cameraSection.style.display  = phase === 'camera'  ? 'flex' : 'none';
  previewSection.style.display = phase === 'preview' ? 'flex' : 'none';
  resultSection.style.display  = phase === 'result'  ? 'flex' : 'none';
}

// ════════════════════════════════════════
//  AUTO MODE UI
// ════════════════════════════════════════
function updateModeUI() {
  if (autoMode) {
    modeLabel.textContent = '⚡ অটো মোড';
    modeLabel.style.color = '#00E5FF';
    overlayTop.textContent = '⚡ ফোকাস হলে অটো স্ক্যান হবে...';
    captureBtnWrap.classList.add('hidden');
    bottomBar.textContent = '📌 ফোন স্থির রাখুন, অটো স্ক্যান হবে';
    document.getElementById('focus-indicator').style.display = 'flex';
  } else {
    modeLabel.textContent = '✋ ম্যানুয়াল মোড';
    modeLabel.style.color = '#888';
    overlayTop.textContent = 'নম্বরে ক্যামেরা ধরুন';
    captureBtnWrap.classList.remove('hidden');
    bottomBar.textContent = '📌 নম্বরের কাছে ধরে বাটন চাপুন';
    document.getElementById('focus-indicator').style.display = 'none';
  }
}

// ════════════════════════════════════════
//  CLIPBOARD
// ════════════════════════════════════════
async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // Fallback
    const el = document.createElement('textarea');
    el.value = text;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  }
}

// ════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
  }, 2500);
}

// ════════════════════════════════════════
//  EVENT LISTENERS
// ════════════════════════════════════════

// Auto toggle
autoToggle.addEventListener('change', () => {
  autoMode = autoToggle.checked;
  saveAutoMode(autoMode);
  updateModeUI();
  showToast(autoMode ? '⚡ অটো মোড চালু' : '✋ ম্যানুয়াল মোড চালু');

  if (autoMode && currentPhase === 'camera') {
    scheduleAutoCapture();
  } else {
    clearTimeout(autoTimer);
    stopBlurMonitor();
    // focus indicator লুকাও manual mode এ
    document.getElementById('focus-indicator').className = '';
  }
});

// Manual capture
captureBtn.addEventListener('click', capture);

// Tap-to-focus (video এ touch/click)
video.addEventListener('touchstart', tapToFocus, { passive: true });
video.addEventListener('click',      tapToFocus);

// Retry
retryBtn.addEventListener('click', rescan);

// Rescan
rescanBtn.addEventListener('click', rescan);

// ════════════════════════════════════════
//  START
// ════════════════════════════════════════
init();
</script>
