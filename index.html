<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>নম্বর স্ক্যানার</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #e2563a;
    --accent2: #f07c64;
    --text: #f0f0f5;
    --muted: #7a7f9a;
    --green: #2ed46a;
    --border: #2e3248;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 32px;
  }

  header {
    width: 100%;
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  .main {
    width: 100%;
    max-width: 480px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Camera area */
  .camera-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4/3;
  }

  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  #canvas { display: none; }

  .cam-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 10px;
    background: rgba(15,17,23,0.6);
    backdrop-filter: blur(2px);
  }

  .cam-overlay.hidden { display: none; }

  .cam-overlay svg {
    width: 48px; height: 48px;
    color: var(--muted);
    opacity: 0.6;
  }

  .cam-overlay p {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    max-width: 200px;
    line-height: 1.5;
  }

  /* Scan frame */
  .scan-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80%; height: 40%;
    pointer-events: none;
  }

  .scan-frame::before, .scan-frame::after,
  .scan-frame span::before, .scan-frame span::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--accent);
    border-style: solid;
  }

  .scan-frame::before { top: 0; left: 0; border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
  .scan-frame::after  { top: 0; right: 0; border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
  .scan-frame span::before { bottom: 0; left: 0; border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }
  .scan-frame span::after  { bottom: 0; right: 0; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }

  /* Scanning line animation */
  .scan-line {
    position: absolute;
    left: 4%; right: 4%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    top: 10%;
    animation: scanAnim 2s ease-in-out infinite;
    border-radius: 1px;
  }

  @keyframes scanAnim {
    0%, 100% { top: 10%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    50% { top: 85%; }
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
  }

  .btn {
    flex: 1;
    padding: 14px 16px;
    border-radius: 14px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: var(--accent2); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: var(--surface); }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  /* Upload */
  #fileInput { display: none; }

  /* Result */
  .result-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    display: none;
  }

  .result-box.visible { display: flex; }

  .result-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .numbers-found {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .number-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s;
    gap: 12px;
  }

  .number-chip:hover {
    border-color: var(--accent);
    background: rgba(226,86,58,0.08);
  }

  .number-chip.copied {
    border-color: var(--green);
    background: rgba(46,212,106,0.08);
  }

  .number-text {
    font-size: 20px;
    font-weight: 700;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    color: var(--text);
  }

  .copy-icon {
    font-size: 18px;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .hint-text {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  /* Loading */
  .loading-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    display: none;
  }

  .loading-box.visible { display: flex; }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-box p {
    font-size: 14px;
    color: var(--muted);
  }

  /* Error */
  .error-box {
    background: rgba(226,86,58,0.1);
    border: 1px solid rgba(226,86,58,0.35);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--accent2);
    display: none;
    line-height: 1.5;
  }

  .error-box.visible { display: block; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #0f1117;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* No number state */
  .no-number {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 8px 0;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <div class="logo">📱</div>
  <div>
    <h1>নম্বর স্ক্যানার</h1>
    <p>স্ক্রিন বা হাতের লেখা থেকে নম্বর কপি করুন</p>
  </div>
</header>

<div class="main">

  <!-- Camera -->
  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="cam-overlay" id="camOverlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <p>ক্যামেরা চালু করুন অথবা ছবি আপলোড করুন</p>
    </div>

    <div class="scan-frame" id="scanFrame" style="display:none;">
      <span></span>
      <div class="scan-line"></div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" id="btnCamera" onclick="startCamera()">
      📷 ক্যামেরা চালু
    </button>
    <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
      🖼️ ছবি দিন
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">

  <button class="btn btn-primary" id="btnCapture" onclick="captureAndScan()" disabled>
    🔍 স্ক্যান করুন
  </button>

  <!-- Loading -->
  <div class="loading-box" id="loadingBox">
    <div class="spinner"></div>
    <p>নম্বর খোঁজা হচ্ছে...</p>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Result -->
  <div class="result-box" id="resultBox">
    <div class="result-label">পাওয়া নম্বর</div>
    <div class="numbers-found" id="numbersFound"></div>
    <div class="hint-text">নম্বরে ট্যাপ করুন → কপি হবে</div>
  </div>

</div>

<div class="toast" id="toast">✓ কপি হয়েছে!</div>

<script>
  let stream = null;
  let capturedImageBase64 = null;

  async function startCamera() {
    try {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
      });
      const video = document.getElementById('video');
      video.srcObject = stream;
      document.getElementById('camOverlay').classList.add('hidden');
      document.getElementById('scanFrame').style.display = 'block';
      document.getElementById('btnCapture').disabled = false;
      document.getElementById('btnCamera').textContent = '🔄 ক্যামেরা বন্ধ';
      document.getElementById('btnCamera').onclick = stopCamera;
      capturedImageBase64 = null;
    } catch (e) {
      showError('ক্যামেরা চালু করা যায়নি। অনুমতি দিন অথবা ছবি আপলোড করুন।');
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    const video = document.getElementById('video');
    video.srcObject = null;
    document.getElementById('camOverlay').classList.remove('hidden');
    document.getElementById('scanFrame').style.display = 'none';
    document.getElementById('btnCapture').disabled = true;
    document.getElementById('btnCamera').textContent = '📷 ক্যামেরা চালু';
    document.getElementById('btnCamera').onclick = startCamera;
  }

  function captureAndScan() {
    if (capturedImageBase64) {
      // Already have an uploaded image
      scanImage(capturedImageBase64);
      return;
    }

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
    scanImage(base64);
  }

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    stopCamera();

    const reader = new FileReader();
    reader.onload = (e) => {
      const base64 = e.target.result.split(',')[1];
      capturedImageBase64 = base64;

      // Show preview
      const video = document.getElementById('video');
      const img = new Image();
      img.onload = () => {
        const canvas = document.getElementById('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.style.display = 'block';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.objectFit = 'cover';
        canvas.style.position = 'absolute';
        canvas.style.top = '0'; canvas.style.left = '0';
      };
      img.src = e.target.result;

      document.getElementById('camOverlay').classList.add('hidden');
      document.getElementById('btnCapture').disabled = false;

      // Auto scan
      scanImage(base64);
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  async function scanImage(base64) {
    showLoading(true);
    hideResult();
    hideError();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: `You are an expert phone number extractor with strong OCR capability for both printed and handwritten text.
Return ONLY a JSON array of strings. No explanation. No markdown. No extra text.
Example: ["01712345678","01987654321"]
Rules:
- Extract ALL phone numbers — printed, digital screen display, AND handwritten
- For handwritten numbers: carefully analyze each digit's shape. Common confusions to watch: 1 vs 7, 0 vs 6 vs 8, 3 vs 8, 4 vs 9. Use context (Bangladeshi numbers start with 01) to resolve ambiguity.
- Include Bangladeshi mobile numbers (11 digits starting with 013, 014, 015, 016, 017, 018, 019)
- Include any other visible phone numbers regardless of country
- Remove all spaces, dashes, brackets from numbers — digits only
- If a number is partially visible or unclear, make your best reasonable guess
- If no numbers found at all, return []`,
          messages: [{
            role: 'user',
            content: [{
              type: 'image',
              source: { type: 'base64', media_type: 'image/jpeg', data: base64 }
            }, {
              type: 'text',
              text: 'Extract all phone numbers from this image, including any handwritten numbers. Return only a JSON array of digit strings.'
            }]
          }]
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || 'API error');
      }

      const raw = data.content?.[0]?.text?.trim() || '[]';
      let numbers = [];

      try {
        // Clean up response
        const cleaned = raw.replace(/```json|```/g, '').trim();
        numbers = JSON.parse(cleaned);
      } catch {
        // Try to extract numbers with regex as fallback
        const matches = raw.match(/01[3-9]\d{8}/g);
        numbers = matches || [];
      }

      showResult(numbers);

    } catch (err) {
      showError('স্ক্যান করা যায়নি: ' + (err.message || 'অজানা সমস্যা'));
    } finally {
      showLoading(false);
    }
  }

  function showResult(numbers) {
    const box = document.getElementById('resultBox');
    const found = document.getElementById('numbersFound');
    found.innerHTML = '';

    if (numbers.length === 0) {
      found.innerHTML = `<div class="no-number">কোনো নম্বর পাওয়া যায়নি।<br>স্পষ্ট আলোতে আবার চেষ্টা করুন।</div>`;
    } else {
      numbers.forEach(num => {
        const chip = document.createElement('div');
        chip.className = 'number-chip';
        chip.innerHTML = `<span class="number-text">${formatNumber(num)}</span><span class="copy-icon">📋</span>`;
        chip.onclick = () => copyNumber(num, chip);
        found.appendChild(chip);
      });
    }

    box.classList.add('visible');
  }

  function formatNumber(num) {
    // Format as 01XXX-XXXXXX for Bangladeshi numbers
    if (/^01[3-9]\d{8}$/.test(num)) {
      return num.slice(0, 5) + '-' + num.slice(5);
    }
    return num;
  }

  async function copyNumber(num, chip) {
    try {
      await navigator.clipboard.writeText(num);
      chip.classList.add('copied');
      chip.querySelector('.copy-icon').textContent = '✅';
      showToast();
      setTimeout(() => {
        chip.classList.remove('copied');
        chip.querySelector('.copy-icon').textContent = '📋';
      }, 2000);
    } catch {
      // Fallback
      const el = document.createElement('textarea');
      el.value = num;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast();
    }
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function showLoading(show) {
    document.getElementById('loadingBox').className = 'loading-box' + (show ? ' visible' : '');
  }

  function hideResult() {
    document.getElementById('resultBox').classList.remove('visible');
  }

  function hideError() {
    document.getElementById('errorBox').classList.remove('visible');
  }

  function showError(msg) {
    const e = document.getElementById('errorBox');
    e.textContent = msg;
    e.classList.add('visible');
  }
</script>
</body>
</html>
