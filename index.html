<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>নম্বর স্ক্যানার</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #e2563a;
    --accent2: #f07c64;
    --text: #f0f0f5;
    --muted: #7a7f9a;
    --green: #2ed46a;
    --border: #2e3248;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
  }

  header {
    width: 100%;
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    width: 38px; height: 38px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  header h1 { font-size: 18px; font-weight: 700; }
  header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .main {
    width: 100%;
    max-width: 480px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Camera */
  .camera-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4/3;
  }

  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  #canvas { display: none; }

  .cam-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    background: rgba(15,17,23,0.7);
  }

  .cam-overlay.hidden { display: none; }

  .cam-overlay svg {
    width: 52px; height: 52px;
    stroke: var(--muted); fill: none;
    opacity: 0.5;
  }

  .cam-overlay p {
    color: var(--muted); font-size: 13px;
    text-align: center; max-width: 200px; line-height: 1.6;
  }

  /* Scan frame corners */
  .scan-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 78%; height: 42%;
    pointer-events: none;
    display: none;
  }

  .scan-frame.show { display: block; }

  .corner {
    position: absolute;
    width: 22px; height: 22px;
    border-color: var(--accent);
    border-style: solid;
  }
  .tl { top:0; left:0;  border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
  .tr { top:0; right:0; border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
  .bl { bottom:0; left:0;  border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }
  .br { bottom:0; right:0; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }

  .scan-line {
    position: absolute; left: 3%; right: 3%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    top: 10%;
    animation: scanMove 2s ease-in-out infinite;
  }

  @keyframes scanMove {
    0%,100% { top: 8%; opacity: 0; }
    10%      { opacity: 1; }
    50%      { top: 88%; }
    90%      { opacity: 1; }
  }

  /* Preview canvas overlay */
  #previewCanvas {
    display: none;
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1; padding: 14px 12px;
    border-radius: 14px; border: none;
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center;
    justify-content: center; gap: 8px;
    font-family: inherit;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-primary  { background: var(--accent); color: #fff; }
  .btn-primary:not(:disabled):hover { background: var(--accent2); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  #fileInput { display: none; }

  /* Loading */
  .loading-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 28px 20px;
    display: none;
    flex-direction: column;
    align-items: center; gap: 14px;
  }
  .loading-box.visible { display: flex; }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-box p { font-size: 14px; color: var(--muted); }

  /* Error */
  .error-box {
    background: rgba(226,86,58,0.1);
    border: 1px solid rgba(226,86,58,0.3);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 13px; color: var(--accent2);
    display: none; line-height: 1.5;
  }
  .error-box.visible { display: block; }

  /* Result */
  .result-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    display: none; flex-direction: column; gap: 14px;
  }
  .result-box.visible { display: flex; }

  .result-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted);
  }

  .numbers-found { display: flex; flex-direction: column; gap: 10px; }

  .number-chip {
    display: flex; align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer; transition: all 0.15s; gap: 12px;
  }
  .number-chip:hover  { border-color: var(--accent); background: rgba(226,86,58,0.07); }
  .number-chip.copied { border-color: var(--green);  background: rgba(46,212,106,0.07); }

  .number-text {
    font-size: 21px; font-weight: 700;
    font-family: 'Courier New', monospace;
    letter-spacing: 1.5px; color: var(--text);
  }

  .copy-icon { font-size: 18px; flex-shrink: 0; }

  .hint-text { font-size: 12px; color: var(--muted); text-align: center; }

  .no-number {
    text-align: center; color: var(--muted);
    font-size: 14px; line-height: 1.7; padding: 6px 0;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green); color: #0f1117;
    padding: 10px 22px; border-radius: 50px;
    font-size: 14px; font-weight: 700;
    transition: transform 0.3s ease;
    z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="logo">📱</div>
  <div>
    <h1>নম্বর স্ক্যানার</h1>
    <p>স্ক্রিন বা হাতের লেখা থেকে নম্বর কপি করুন</p>
  </div>
</header>

<div class="main">

  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <canvas id="previewCanvas"></canvas>

    <div class="cam-overlay" id="camOverlay">
      <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <p>ক্যামেরা চালু করুন অথবা ছবি আপলোড করুন</p>
    </div>

    <div class="scan-frame" id="scanFrame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btnCamera" onclick="startCamera()">📷 ক্যামেরা চালু</button>
    <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">🖼️ ছবি দিন</button>
  </div>

  <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">

  <button class="btn btn-primary" id="btnScan" onclick="captureAndScan()" disabled>🔍 স্ক্যান করুন</button>

  <div class="loading-box" id="loadingBox">
    <div class="spinner"></div>
    <p>নম্বর খোঁজা হচ্ছে...</p>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-box" id="resultBox">
    <div class="result-label">পাওয়া নম্বর</div>
    <div class="numbers-found" id="numbersFound"></div>
    <div class="hint-text">নম্বরে ট্যাপ করুন → কপি হবে</div>
  </div>

</div>

<div class="toast" id="toast">✓ কপি হয়েছে!</div>

<script>
  let stream = null;
  let uploadedBase64 = null;

  // ── Camera ──────────────────────────────────────────
  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
      });
      document.getElementById('video').srcObject = stream;
      document.getElementById('previewCanvas').style.display = 'none';
      document.getElementById('camOverlay').classList.add('hidden');
      document.getElementById('scanFrame').classList.add('show');
      document.getElementById('btnScan').disabled = false;
      document.getElementById('btnCamera').textContent = '⏹ ক্যামেরা বন্ধ';
      document.getElementById('btnCamera').onclick = stopCamera;
      uploadedBase64 = null;
    } catch {
      showError('ক্যামেরার অনুমতি দিন অথবা ছবি আপলোড করুন।');
    }
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    document.getElementById('video').srcObject = null;
    document.getElementById('camOverlay').classList.remove('hidden');
    document.getElementById('scanFrame').classList.remove('show');
    document.getElementById('btnScan').disabled = true;
    document.getElementById('btnCamera').textContent = '📷 ক্যামেরা চালু';
    document.getElementById('btnCamera').onclick = startCamera;
  }

  // ── File upload ─────────────────────────────────────
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    stopCamera();
    const reader = new FileReader();
    reader.onload = ev => {
      const base64 = ev.target.result.split(',')[1];
      uploadedBase64 = base64;
      // show preview
      const img = new Image();
      img.onload = () => {
        const pc = document.getElementById('previewCanvas');
        pc.width = img.width; pc.height = img.height;
        pc.getContext('2d').drawImage(img, 0, 0);
        pc.style.display = 'block';
      };
      img.src = ev.target.result;
      document.getElementById('camOverlay').classList.add('hidden');
      document.getElementById('btnScan').disabled = false;
      scanImage(base64);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  // ── Capture from live camera ─────────────────────────
  function captureAndScan() {
    if (uploadedBase64) { scanImage(uploadedBase64); return; }
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const base64 = canvas.toDataURL('image/jpeg', 0.88).split(',')[1];
    scanImage(base64);
  }

  // ── API call ─────────────────────────────────────────
  function getApiKey() {
    let key = localStorage.getItem('groq_api_key');
    if (!key) {
      key = prompt('Groq API Key দিন (console.groq.com থেকে নিন):');
      if (key) localStorage.setItem('groq_api_key', key);
    }
    return key;
  }

  async function scanImage(base64) {
    showLoading(true);
    hideResult(); hideError();

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${getApiKey()}`
        },
        body: JSON.stringify({
          model: 'qwen/qwen3.6-27b',
          max_tokens: 500,
          messages: [{
            role: 'user',
            content: [
              { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${base64}` } },
              { type: 'text', text: `/no_think\nExtract ALL phone numbers from this image — printed, screen display, or handwritten.\nReturn ONLY a JSON array of digit strings. No explanation. No markdown. No extra text.\nExample: ["01712345678","01987654321"]\nRules:\n- Include Bangladeshi numbers (11 digits starting with 013-019)\n- Include any other phone numbers\n- Digits only — remove spaces, dashes, brackets\n- For handwritten: watch 1 vs 7, 0 vs 6 vs 8, 3 vs 8\n- If none found, return []` }
            ]
          }]
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || 'API error');

      let raw = data.choices?.[0]?.message?.content?.trim() || '[]';
      raw = raw.replace(/<think>[\s\S]*?<\/think>/gi, '');
      raw = raw.replace(/<think>[\s\S]*/gi, '');
      raw = raw.replace(/```json|```/g, '').trim();
      const match = raw.match(/\[[\s\S]*\]/);
      const jsonStr = match ? match[0] : '[]';

      let numbers = JSON.parse(jsonStr);
      if (!Array.isArray(numbers)) numbers = [];
      numbers = numbers.map(n => { const m = n.match(/0?0?8?8?(01[3-9]\d{8})$/); return m ? m[1] : n; });
      showResult(numbers);
    } catch (err) {
      showError('স্ক্যান করা যায়নি: ' + err.message);
    } finally {
      showLoading(false);
    }
  }

  // ── UI helpers ───────────────────────────────────────
  function showResult(numbers) {
    const found = document.getElementById('numbersFound');
    found.innerHTML = '';

    if (!numbers.length) {
      found.innerHTML = `<div class="no-number">কোনো নম্বর পাওয়া যায়নি।<br>ভালো আলোতে আবার চেষ্টা করুন।</div>`;
    } else {
      numbers.forEach(num => {
        const chip = document.createElement('div');
        chip.className = 'number-chip';
        chip.innerHTML = `<span class="number-text">${fmt(num)}</span><span class="copy-icon">📋</span>`;
        chip.onclick = () => copyNum(num, chip);
        found.appendChild(chip);
      });
    }
    document.getElementById('resultBox').classList.add('visible');
  }

  function fmt(n) {
    return n;
  }

  async function copyNum(num, chip) {
    try {
      await navigator.clipboard.writeText(num);
    } catch {
      const el = Object.assign(document.createElement('textarea'), { value: num });
      document.body.appendChild(el); el.select();
      document.execCommand('copy'); document.body.removeChild(el);
    }
    chip.classList.add('copied');
    chip.querySelector('.copy-icon').textContent = '✅';
    showToast();
    setTimeout(() => { chip.classList.remove('copied'); chip.querySelector('.copy-icon').textContent = '📋'; }, 2200);
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function showLoading(v) {
    document.getElementById('loadingBox').className = 'loading-box' + (v ? ' visible' : '');
  }
  function hideResult() { document.getElementById('resultBox').classList.remove('visible'); }
  function hideError()  { document.getElementById('errorBox').classList.remove('visible'); }
  function showError(m) {
    const e = document.getElementById('errorBox');
    e.textContent = m; e.classList.add('visible');
  }
</script>
</body>
</html>
